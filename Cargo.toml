[package]
name = "rafor"
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Andrei Stroganov <savthe@gmail.com>"]
description = "Fast Random Forest library."
readme = "README.md"
repository = "https://github.com/savthe/rafor/"
exclude = ["src/main.rs"]
keywords = ["ml", "random-forest", "decision-tree"]
categories = ["algorithms", "data-structures"]

[dependencies]
argminmax = { version = "0.6.3", default-features = false, features = [
  "float",
] }
radsort = "0.1.1"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
bitvec = { version = "1.0", features = ["serde"] }

[dev-dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
num_cpus = "1.17.0"

[profile.release]
debug = true
